<!DOCTYPE html>
<html>
    <head>
        <!-- 2024. 04. 19. 9:32 -->
        <title>Sierpinski Triangle</title>

        <style>
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                touch-action: none;


                background-color: black;
                /* background-image: linear-gradient(125deg, #222, black); */
            }

            #myCanvas {
                position: absolute; left: 50%; top: 50%;
                transform: translate(-50%, -50%);
            }

            div {
                position: absolute;
                height: 50vh;
                transition: backdrop-filter .5s;
                width: 50vw;
            }

            .still div:hover {
                backdrop-filter: brightness(5);
            }
        </style>
    </head>
    <body class="still">
        <canvas id="myCanvas"></canvas>
        <div style="top: 0; left: 25vw;"></div>
        <div style="top: 50.5vh; left: 0;"></div>
        <div style="top: 50.5vh; left: 50vw;"></div>

        <script>
            const myCanvas = document.getElementById("myCanvas"), canv = myCanvas.getContext("2d"), size = Math.min(innerHeight*2/Math.sqrt(3), innerWidth) * .9;
            let previousIsDone = true;

            let draw = () => {
                if (previousIsDone) {
                    previousIsDone = false;
                    const pattern = canv.createPattern(myCanvas, "no-repeat");
                    for (let scale = 100; scale >= 50; scale--) {
                        setTimeout(() => {
                            let s = 100 / scale - 1;
                            canv.fillStyle = pattern;
                            canv.setTransform(1, 0, 0, 1, 0, 0);
                            canv.clearRect(0, 0, myCanvas.width, myCanvas.height);
                            canv.scale(scale/100, scale/100);

                            canv.translate(0, myCanvas.height*s);
                            canv.fillRect(0, 0, myCanvas.width, myCanvas.height);

                            canv.translate(myCanvas.width*s, 0);
                            canv.fillRect(0, 0, myCanvas.width, myCanvas.height);

                            canv.translate(-myCanvas.width/2*s, -myCanvas.height*s);
                            canv.fillRect(0, 0, myCanvas.width, myCanvas.height);

                            if (scale == 50)previousIsDone = true;
                        }, (1000-10*scale));
                    }
                }
            }
            let keep_going = false, started = false;
            document.addEventListener('click', () => {
                keep_going = 1 - keep_going;
                keep_going ? document.body.classList.remove("still") : document.body.classList.add("still");
                if (!started) {
                    canv.setTransform(1, 0, 0, 1, 0, 0);
                    canv.fillStyle = "white";
                    canv.beginPath();
                    canv.moveTo(0, myCanvas.height);
                    canv.lineTo(myCanvas.width/2, 0);
                    canv.lineTo(myCanvas.width, myCanvas.height);
                    canv.fill();

                    setInterval(() => {
                        if (keep_going) {
                            draw();
                        }
                    }, 1100);
                }
                started = true;
            });

            let setup = () => {
                myCanvas.width = size;
                myCanvas.height = size*Math.sqrt(3)/2;

                canv.fillStyle = "white";
                canv.beginPath();
                canv.moveTo(0, myCanvas.height);
                canv.lineTo(myCanvas.width/2, 0);
                canv.lineTo(myCanvas.width, myCanvas.height);
                canv.fill();

                for (let i = 0; i < 8; i++) {
                    const pattern = canv.createPattern(myCanvas, "no-repeat");
                        canv.fillStyle = pattern;
                        canv.setTransform(1, 0, 0, 1, 0, 0);
                        canv.clearRect(0, 0, myCanvas.width, myCanvas.height)
                        canv.scale(.5, .5);

                        canv.translate(0, myCanvas.height);
                        canv.fillRect(0, 0, myCanvas.width, myCanvas.height);

                        canv.translate(myCanvas.width, 0);
                        canv.fillRect(0, 0, myCanvas.width, myCanvas.height);

                        canv.translate(-myCanvas.width/2, -myCanvas.height);
                        canv.fillRect(0, 0, myCanvas.width, myCanvas.height);
                }
            }
            setup();

            document.height = document.body.getBoundingClientRect().width*0.75;
        </script>
    </body>
</html>

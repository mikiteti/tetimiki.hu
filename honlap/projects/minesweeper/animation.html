
<!DOCTYPE html>
<html>
    <head>
        <!-- 2023. 09. 23. 17:03 -->
        <title>Aknakereső</title>

        <meta charset="utf-8">
		<meta name="viewport" content="user-scalable=no, viewport-fit=cover">

        <style>
			@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
			@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

            * {
                /*font-family: 'Righteous', cursive;*/
				/*font-family: 'Montserrat', sans-serif;*/
				font-family: 'Roboto Mono', monospace;
                cursor: pointer;
                color: antiquewhite;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-user-callout: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-user-modify: none;
				-webkit-highlight: none;
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
				touch-action: none;
            }

            img {
                transition: filter 0.5s, transform 0.5s;
                position: absolute; left: 0;
            }

            body {
                margin: 0;
                height: 100vh;
				
                background: #111;
            }

            #container {
                height: 1950px; width: 900px;
                position: absolute; left: 50%; top: 50%;
            }

            #header {
                width: 100%; height: 150px;

                display: grid; grid-template-columns: 33.33% 33.33% 33.33%;
            }

            #header div {
                width: 100%; height: 150px;

                display: table-cell;
                font-size: 100px;
                text-align: center;
				line-height: 100px;
            }

            #frame {
                width: 900px; height: 1800px;
                display: grid; grid-template-columns: repeat(9, auto); grid-template-rows: repeat(18, auto);
            }

            .block {
                width: 100px; height: 100px;
                
                box-shadow: inset 10px 10px 10px #777, inset -10px -10px 10px #111;
                transform: scale(95%);
                line-height: 100px; text-align: center; font-size: 100px;
                background: #555;
            }

            #summary {
                width: 500px; height: 800px;
                padding: 100px;
                position: absolute; left: calc(50% - 350px); top: calc(50% - 500px);

                display: none;
                background: rgba(0, 0, 0, 0.6);
                opacity: 0;
                transition: opacity 0.5s;
            }

            #summary h1 {
                width: 700px; height: 125px;
                margin-top: 87.5px; margin-bottom: 87.5px;
				transform: translate(-100px, 0);
                
                text-align: center; font-size: 100px; font-weight: 700; line-height: 115px;
            }

            #summary div {
                height: 150px;
            }

            #summary div p {
				margin: 0;
                position: absolute;
                display: table-cell;

                font-size: 58px;
				line-height: 100px;
            }

            #summary div p:last-child {
                right: 100px;
            }
		

			@supports (-webkit-touch-callout: none) {
				body {
					transform: translate(0, -10px) scale(0.95);
				}
				
				#summary {
					top: calc(52.75% - 500px);
				}
				
				#help {
					width: 37.1%; height: 5px;
					position: absolute; left: 31.45%; bottom: -24.5px;
					background: #c0c0c0;
					border-radius: 4px;
				}
				
				/*@media all and (display-mode: standalone) {
					#summary {
						background: #ff0000!important;
					}
				}*/
			}
        </style>
    </head>
    <body onmousedown="mouse_pressed = true;" ontouchstart="mouse_pressed = true;" onmouseup="mouse_pressed = false;" ontouchend="mouse_pressed = false;">
        <div id="container">
            <div id="header">
                <div id="flagging" onclick="if (generated && !gameOver) flagging();"><img src="img/ghost_v2.svg" width="100" alt="" style="left: 100px;"></div>
                <div id="time">0:00</div>
                <div id="remaining_mines">24</div>
            </div>
            <div id="frame"></div>
        </div>
        <div id="summary">
            <h1>GYŐZTÉL!</h1>
            <div>
                <p>Aknák:</p><p>24</p>
            </div>
            <div>
                <p>Idő:</p><p></p>
            </div>
            <div>
                <p onclick="location.reload();">Új Játék:</p><p>05.0</p>
            </div>
        </div>

        <script>
			// constants, variables
            var number_of_mines = 24;
            const number_of_rows = 18, number_of_columns = 9, standAlone = window.navigator.standalone;
            const colors = ["white", "hsl(210, 100%, 50%)", "hsl(182, 100%, 50%)", "hsl(153, 100%, 50%)", "hsl(45, 100%, 50%)", "hsl(11, 100%, 50%)", "hsl(327, 100%, 50%)", "hsl(283, 100%, 50%)", "hsl(267, 100%, 50%)"];
            
            // constants, variables #2
            var matrix = [], state = [], scale;
            for (let i = 0; i < number_of_columns; i++) {
                let e = [], f = [];
                for (let j = 0; j < number_of_rows; j++) {
                    e.push(0);
                    f.push(0);
                }
                matrix.push(e);
                state.push(f);
            }
            var generated = false, unrevealed = number_of_columns*number_of_rows, gameOver = false, detected = 0, falsely_detected = 0, mouse_is_down = false, mouse_pressed = false;
            const container = document.getElementById("container"), summary = document.getElementById("summary");
            var flagging_rn = false, justInTime = false, timer = 0, touchScreen = ( 'ontouchstart' in window ) || ( navigator.maxTouchPoints > 0 ) || ( navigator.msMaxTouchPoints > 0 );

            // html adjustments
            scale = Math.min(window.innerHeight/2200, innerWidth/900);
            container.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
            document.getElementById("summary").style.transform = "scale(" + scale + ")";
            summary.children[1].lastElementChild.innerHTML = number_of_mines;
            document.getElementById("remaining_mines").innerHTML = number_of_mines;
			// console.log(window.screen.orientation);

			let down = (x, y) => {
				mouse_is_down = true;
				if (flagging_rn) { 
					flag(x, y);
				} else { 
					justInTime = true;
					setTimeout(() => {
						if (mouse_is_down == true) flag(x, y);
						justInTime = false;
					}, 250);
                }
			}

			let up = (x, y) => {
				if (!flagging_rn && justInTime) reveal(x, y);
				mouse_is_down = false;
			}

            for (let i = 0; i < number_of_rows; i++) { // creating matrix
                for (let j = 0; j < number_of_columns; j++) {
                    let e = document.createElement("div");
                    e.classList.add("block");
                    if (!(('ontouchstart' in window) || (navigator.msMaxTouchPoints > 0))) { // if not touch device
                        e.addEventListener('mousedown', function () { down(j, i); });
                        e.addEventListener('mouseup', function () { up(j, i); });
                    }
                    e.addEventListener('touchstart', function () { down(j, i); }, { passive: true });
					e.addEventListener('touchend', function () { up(j, i); });
                    frame.appendChild(e);
                }
            }

            // code
            let getBlock = (x, y) => { return document.getElementsByClassName("block")[x + y*number_of_columns]; }

            let color = () => {
                for (let i = 0; i < number_of_columns; i++) {
                    for (let j = 0; j < number_of_rows; j++) {
                        getBlock(i,j).innerHTML = '<img src="img/ghost_v2.svg" width="100" style="filter: grayscale(1); transform: scale(0);">';
                        if (matrix[i][j] > 0) getBlock(i,j).style.color = colors[matrix[i][j]];
                    }
                }
            }

            let generate = (x, y) => {
                setInterval(() => {
                    if (!gameOver && !stop) {
                        timer++;
                        let text = Math.floor(timer/60) + ":";
                        if (timer%60 < 10) text += "0";
                        document.getElementById("time").innerHTML = text + timer%60;
                    }
                }, 1000);

                for (let i = 0; i < number_of_mines; i++) {
                    let randX = x, randY = y;
                    while (matrix[randX][randY] == -1 || Math.abs(randX-x) < 2 && Math.abs(randY-y) < 2) {
                        randX = Math.floor(Math.random() * number_of_columns);
                        randY = Math.floor(Math.random() * number_of_rows);
                    }
                    matrix[randX][randY] = -1;
                }

                for (let i = 0; i < number_of_columns; i++) {
                    for (let j = 0; j < number_of_rows; j++) {
                        if (matrix[i][j] != -1) {
                            for (let k = -1; k < 2; k++) {
                                for (let l = -1; l < 2; l++) {
                                    if (0 <= i+k && i+k < number_of_columns && 0 <= j+l && j+l < number_of_rows && matrix[i+k][j+l] == -1) matrix[i][j]++;
                                }
                            }
                        }
                    }
                }

                color();

                generated = true;
            }

            let game_over = (result) => {
                gameOver = true;
                if (result == "lose") {
                    summary.firstElementChild.innerHTML = "VESZTETTÉL!";
                    summary.children[1].lastElementChild.innerHTML = detected;
                }
                
                summary.children[2].lastElementChild.innerHTML = document.getElementById("time").innerHTML;
                summary.style.display = "block";
                setTimeout(() => { summary.style.opacity = "1"; }, 0);
				
				let countdown = 50;
				setInterval(() => {
					if (!mouse_pressed) {
						countdown--;
						countdown % 10 ? summary.lastElementChild.lastElementChild.innerHTML = "0" + countdown/10 : summary.lastElementChild.lastElementChild.innerHTML = "0" + countdown/10 + ".0";
						if (!countdown) location.reload();
					}
				}, 100);
            }

            let revealSurrounding = (x, y) => {
                for (let k = -1; k < 2; k++) {
                    for (let l = -1; l < 2; l++) {
                        if ((k || l) && 0 <= x+k && x+k < number_of_columns && 0 <= y+l && y+l < number_of_rows) reveal(x+k, y+l, true);
                    }
                }
            }

            let reveal = (x, y, recursively_called = false) => {
                if (!generated) generate(x, y);
                
                if (!gameOver) {
                    if (state[x][y] == 1) {
                        if (!recursively_called) {
                            let surrounding = matrix[x][y];
                            for (let k = -1; k < 2; k++) {
                                for (let l = -1; l < 2; l++) {
                                    if ((k || l) && 0 <= x+k && x+k < number_of_columns && 0 <= y+l && y+l < number_of_rows && state[x+k][y+l] == 2) surrounding--;
                                }
                            }
                            if (!surrounding) revealSurrounding(x, y);
                        }
                    } else if (state[x][y] == 0) {
                        state[x][y] = 1;
                        unrevealed--;
                        getBlock(x, y).style.boxShadow = "none";

                        if (matrix[x][y] > 0) {
                            getBlock(x,y).innerHTML = getBlock(x,y).innerHTML +  String(matrix[x][y]);
                        } else if (matrix[x][y] == 0) {
                            revealSurrounding(x, y);
                        } else if (matrix[x][y] == -1) {
                            getBlock(x,y).innerHTML += '<img src="img/bomb_v4.svg" width="100">';
                            game_over("lose");
                            return 0;
                        }
                    }

                    if (!unrevealed && !number_of_mines) game_over("win");
                }
            }

            let flag = (x, y) => {
                if (generated && !gameOver) {
                    if (state[x][y] == 0) {
                        state[x][y] = 2;
                        number_of_mines--;
                        unrevealed--;
                        matrix[x][y] == -1 ? detected++ : falsely_detected++;
                        if (!unrevealed && !number_of_mines) game_over("win");
                        getBlock(x, y).firstElementChild.style.filter = "grayscale(0)";
                        getBlock(x, y).firstElementChild.style.transform = "scale(1)";
                    } else if (state[x][y] == 2) {
                        state[x][y] = 0;
                        number_of_mines++;
                        unrevealed++;
                        matrix[x][y] == -1 ? detected-- : falsely_detected--;
                        getBlock(x, y).firstElementChild.style.filter = "grayscale(1)";
                        flagging_rn ? getBlock(x, y).firstElementChild.style.transform = "scale(0.75)" : getBlock(x, y).firstElementChild.style.transform = "scale(0)";
                    }
                    document.getElementById("remaining_mines").innerHTML = number_of_mines;
                }
            }

            let flagging = () => {
                flagging_rn = 1 - flagging_rn;
                for (let i = 0; i < number_of_columns; i++) {
                    for (let j = 0; j < number_of_rows; j++) {
                        if (state[i][j] == 0) {
                            if (flagging_rn == 1) {
                                getBlock(i, j).firstElementChild.style.transform = 'scale(0.75)';
                            } else {
                                getBlock(i, j).firstElementChild.style.transform = 'scale(0)';
                            }
                        }
                    }
                }
            }

            let stop = 0;
            window.addEventListener('keydown', function () { stop = 1 - stop; });
        </script>
    </body>
</html>

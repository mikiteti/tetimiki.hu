<!DOCTYPE html>
<html>
	<head>
		<!-- 2021. 10. 25. 15:40 -->
		<title>Koch Görbe</title>
		<meta charset="utf-8">
		<script>
            console.log('%cCOPYRIGHT © 2021 TÉTI MIKI. ALL RIGHTS RESERVED.', 'color: green; font-weight: bold');
		</script>

        <script src="../../../p5/p5.min.js"></script>
        <script>
            function setup() {
                createCanvas(2000, 900);

                stroke(255);
                strokeWeight(10);
                noLoop();
            }


            function draw() {
                clear();
                for (i = 0; i < xy.length/2-1; i++) {
                    line(width / 2 + xy[2*i] * 900, height / 2 - (xy[2*i+1] - 0.216) * 900, width / 2 + xy[2*i+2] * 900, height / 2 - (xy[2*i+3] - 0.216) * 900);
                }
            }


            var xy = [-1, 0, 1, 0];
            var l = 2;

            const a2 = Math.atan(Math.sqrt(3) / 2 / 1.5), l2 = Math.sqrt(1.5 * 1.5 + 3 / 4);
            var newxy = [];
            function more() {
                newxy = [-1, 0];
                l /= 3;
                for (i = 0; i < xy.length/2-1; i++) {
                    let a = (xy[2*i+2] - xy[2*i]) / l / 3;
                    if (a > 1) { a = 1 };
                    let b = Math.sign(xy[2*i+3] - xy[2*i+1]);
                    if (!b) b = Math.sign(xy[2*i+2] - xy[2*i]);
                    let angle = Math.acos(a) * b;
                    newxy.push(
                        1/3 * (xy[2*i+2] - xy[2*i]) + xy[2*i], 1/3 * (xy[2*i+3] - xy[2*i+1]) + xy[2*i+1], 
                        xy[2*i] + Math.cos(angle + a2) * l2 * l, xy[2*i+1] + Math.sin(angle + a2) * l2 * l,
                        2/3 * (xy[2*i+2] - xy[2*i]) + xy[2*i], 2/3 * (xy[2*i+3] - xy[2*i+1]) + xy[2*i+1],
                        xy[2*i+2], xy[2*i+3]
                    );
                }
                xy = newxy;
                draw();
            }

        </script>
    </head>
	<body style="background-color: black; background-image: linear-gradient(125deg, #333, black); margin: 0; touch-action: none;overflow: hidden;" onclick="more();">
        <main style="width: 2000px; height: 900px; position: absolute; left: calc(50% - 1000px); top: calc(50% - 450px);"></main>

        <script>
            document.getElementsByTagName("main")[0].style.transform = 'scale(' + window.innerWidth / 2000 * 0.9 + ")";
            document.body.style.width  = window.innerWidth  + "px";
            document.body.style.height = window.innerHeight + "px";
        </script>
    </body>
</html>
